replicaCount: 1

image:
  repository: ghcr.io/diverofdark/trmnl-cyberpunk
  pullPolicy: Always
  # Overrides the image tag (defaults to Chart.appVersion)
  tag: ""

imagePullSecrets: []

serviceAccount:
  create: false

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: trmnl.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Base URL the TRMNL device will use to fetch images — must be reachable from the device.
baseUrl: "http://trmnl-cyberpunk:8080"

# How often (seconds) the dashboard image is regenerated and the device is asked to refresh.
refreshSecs: "3600"

# TRMNL API key returned during /api/setup provisioning.
trmnlApiKey: "cyberpunk-byos"

# ── Live data sources (all optional — falls back to mock data when blank) ──

# Prometheus scrape endpoint for node_exporter host metrics.
prometheusUrl: ""

# Alertmanager API for active alerts.
alertmanagerUrl: ""

# Nextcloud CalDAV for today's agenda.
nextcloudUrl: ""
nextcloudUser: ""
nextcloudPass: ""   # stored in Secret

# ActualBudget HTTP API sidecar for budget data.
actualbudgetUrl: ""
actualbudgetKey: ""  # stored in Secret

# Open-Meteo weather location (no API key required).
weatherLat: "52.50"
weatherLon: "13.33"
weatherTz: "Europe/Berlin"

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}
