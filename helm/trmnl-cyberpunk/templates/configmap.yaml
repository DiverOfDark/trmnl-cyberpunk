apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trmnl-cyberpunk.fullname" . }}
  labels:
    {{- include "trmnl-cyberpunk.labels" . | nindent 4 }}
data:
  BASE_URL: {{ .Values.baseUrl | quote }}
  REFRESH_SECS: {{ .Values.refreshSecs | quote }}
  FETCH_INTERVAL_SECS: {{ .Values.fetchIntervalSecs | default "300" | quote }}
  LISTEN: "0.0.0.0:8080"
  RUST_LOG: "trmnl_cyberpunk=info"
  TZ: {{ .Values.timezone | default "Europe/Berlin" | quote }}
  PROMETHEUS_URL: {{ .Values.prometheusUrl | default "" | quote }}
  ALERTMANAGER_URL: {{ .Values.alertmanagerUrl | default "" | quote }}
  ACTUALBUDGET_URL: {{ .Values.actualbudgetUrl | default "" | quote }}
  {{- if .Values.actualbudgetFixedGroups }}
  ACTUALBUDGET_FIXED_GROUPS: {{ .Values.actualbudgetFixedGroups | quote }}
  {{- end }}
  {{- if .Values.actualbudgetVariableGroups }}
  ACTUALBUDGET_VARIABLE_GROUPS: {{ .Values.actualbudgetVariableGroups | quote }}
  {{- end }}
  {{- if .Values.actualbudgetSavingsGroups }}
  ACTUALBUDGET_SAVINGS_GROUPS: {{ .Values.actualbudgetSavingsGroups | quote }}
  {{- end }}
  WEATHER_LAT: {{ .Values.weatherLat | default "52.50" | quote }}
  WEATHER_LON: {{ .Values.weatherLon | default "13.33" | quote }}
  WEATHER_TZ: {{ .Values.weatherTz | default "Europe/Berlin" | quote }}
  TRACKHOUND_BASE_URL: {{ .Values.trackhoundBaseUrl | default "" | quote }}
