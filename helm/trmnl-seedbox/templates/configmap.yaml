apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trmnl-seedbox.fullname" . }}
  labels:
    {{- include "trmnl-seedbox.labels" . | nindent 4 }}
data:
  BASE_URL: {{ .Values.baseUrl | quote }}
  REFRESH_SECS: {{ .Values.refreshSecs | quote }}
  FONT_DIR: "/app/fonts"
  LISTEN: "0.0.0.0:8080"
  RUST_LOG: "trmnl_seedbox=info"
