services:
  trmnl-seedbox:
    build: .
    container_name: trmnl-seedbox
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # URL the TRMNL device will be told to fetch images from.
      # Must be reachable from the device — set to your LAN IP.
      BASE_URL: "http://192.168.1.100:8080"

      # How often (seconds) to regenerate the dashboard (default: 3600 = 1h)
      REFRESH_SECS: "3600"

      FONT_DIR: "/app/fonts"
      LISTEN: "0.0.0.0:8080"
      RUST_LOG: "trmnl_seedbox=info"
