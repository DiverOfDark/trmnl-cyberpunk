services:
  trmnl-cyberpunk:
    build: .
    container_name: trmnl-cyberpunk
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # URL the TRMNL device will be told to fetch images from.
      # Must be reachable from the device — set to your LAN IP.
      BASE_URL: "http://192.168.1.100:8080"

      # How often (seconds) the firmware should poll. The PNG itself is
      # rendered fresh on every device fetch. Default: 3600 = 1h.
      REFRESH_SECS: "3600"

      # How often (seconds) the background task refetches upstream data.
      # Requests render from that cache and never fetch inline, so this is
      # what decides how current the panel is. Default: 300 = 5m.
      FETCH_INTERVAL_SECS: "300"

      LISTEN: "0.0.0.0:8080"
      RUST_LOG: "trmnl_cyberpunk=info"

      # Prometheus / Alertmanager (leave blank to use mock data)
      PROMETHEUS_URL: ""
      ALERTMANAGER_URL: ""

      # Nextcloud CalDAV — leave blank to use mock agenda
      NEXTCLOUD_URL: ""
      NEXTCLOUD_USER: ""
      NEXTCLOUD_PASS: ""

      # ActualBudget HTTP API — leave blank to use mock budget
      ACTUALBUDGET_URL: ""
      ACTUALBUDGET_KEY: ""
      # Optional: classify budget envelopes by category-group name (comma-
      # separated, case-insensitive substrings). Blank → built-in defaults.
      ACTUALBUDGET_FIXED_GROUPS: ""
      ACTUALBUDGET_VARIABLE_GROUPS: ""
      ACTUALBUDGET_SAVINGS_GROUPS: ""

      # Weather location (Open-Meteo, no key needed)
      WEATHER_LAT: "52.50"
      WEATHER_LON: "13.33"
      WEATHER_TZ: "Europe/Berlin"

      # trackhound base URL for parcel highlights — leave blank to disable.
      # See https://github.com/DiverOfDark/trackhound
      TRACKHOUND_BASE_URL: ""
