services:
  trmnl-cyberpunk:
    build: .
    container_name: trmnl-cyberpunk
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # URL the TRMNL device will be told to fetch images from.
      # Must be reachable from the device — set to your LAN IP.
      BASE_URL: "http://192.168.1.100:8080"

      # How often (seconds) to refetch upstream data and how often the
      # firmware should poll. The PNG itself is rendered fresh on every
      # device fetch. Default: 3600 = 1h.
      REFRESH_SECS: "3600"

      LISTEN: "0.0.0.0:8080"
      RUST_LOG: "trmnl_cyberpunk=info"

      # Prometheus / Alertmanager (leave blank to use mock data)
      PROMETHEUS_URL: ""
      ALERTMANAGER_URL: ""

      # Nextcloud CalDAV — leave blank to use mock agenda
      NEXTCLOUD_URL: ""
      NEXTCLOUD_USER: ""
      NEXTCLOUD_PASS: ""

      # ActualBudget HTTP API — leave blank to use mock budget
      ACTUALBUDGET_URL: ""
      ACTUALBUDGET_KEY: ""

      # Weather location (Open-Meteo, no key needed)
      WEATHER_LAT: "52.50"
      WEATHER_LON: "13.33"
      WEATHER_TZ: "Europe/Berlin"
      SEVENTEENTRACK_KEY: ""
